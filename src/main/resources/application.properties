# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
# Render inyecta la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# DataSource se configura manualmente con @Configuration
# Se excluye la auto-configuracion para evitar conflicto con las claves db.* y smtp.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ---------------------------------------------------------------------------
# IMPORTANTE: las contrasenas NO se escriben aqui. En Render se definen como
# variables de entorno y Spring las aplica automaticamente sobre estas claves:
#   DB_HOST -> db.host, DB_PASSWORD -> db.password, KAFKA_USERNAME -> kafka.username, etc.
# ---------------------------------------------------------------------------

# =============================================
# Base de Datos MySQL (TiDB Cloud en Render)
# DB_HOST, DB_PORT (4000 en TiDB), DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSL_MODE (REQUIRED en TiDB)
# =============================================
db.host=localhost
db.port=3306
db.name=crud_usuarios
db.username=root
db.password=
db.ssl-mode=DISABLED

# =============================================
# Kafka (Aiven) - Paso 2: users publica las notificaciones
# KAFKA_BOOTSTRAP_SERVERS, KAFKA_USERNAME, KAFKA_PASSWORD, KAFKA_CA_CERT (contenido PEM del ca.pem)
# =============================================
kafka.topic=notificaciones
kafka.bootstrap-servers=localhost:9092
kafka.security-protocol=SASL_SSL
kafka.sasl-mechanism=SCRAM-SHA-256
kafka.username=
kafka.password=
kafka.ca-cert=

spring.kafka.bootstrap-servers=${kafka.bootstrap-servers}
spring.kafka.security.protocol=${kafka.security-protocol}
spring.kafka.properties.sasl.mechanism=${kafka.sasl-mechanism}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${kafka.username}" password="${kafka.password}";
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-certificates=${kafka.ca-cert}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# =============================================
# Microservicio accounts - Paso 5: POST {ACCOUNTS_URL}/api/accounts
# ACCOUNTS_URL (ej: https://accounts-xxxx.onrender.com)
# =============================================
accounts.url=http://localhost:8081

# =============================================
# SMTP (JavaMail) - solo lo usa la CLI de escritorio legada (DependencyContainer).
# El servicio REST ya no envia correos: los publica en Kafka y notifiers los envia con Brevo.
# =============================================
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=tu_correo@gmail.com
smtp.password=tu_app_password_aqui
smtp.from.address=tu_correo@gmail.com
smtp.from.name=Gestion de Usuarios
